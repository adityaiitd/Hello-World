name: Publish dashboard to gh-pages

# Publishes the interactive dashboard (the dashboard/ folder) to the gh-pages
# branch. To make it publicly accessible, enable GitHub Pages once in repo
# Settings -> Pages -> Deploy from a branch -> gh-pages / root.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish dashboard folder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dashboard
          commit_message: "Publish dashboard to GitHub Pages"
